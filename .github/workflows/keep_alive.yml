name: Keep-Alive Cloud Server 24/7

on:
  schedule:
    # A cada 10 minutos (Render adormece aos 15 minutos)
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Cloud Services (WhatsApp + Telegram)
        run: |
          curl -s -f -m 30 "https://whatsapp-dev-assistant.onrender.com/api/health" || curl -s -f -m 30 "https://whatsapp-dev-assistant.onrender.com/" || true
          curl -s -f -m 30 "https://telegram-master-bot-17bj.onrender.com/health" || true
          echo "Pings de keep-alive enviados para ambos os serviços no Render."

